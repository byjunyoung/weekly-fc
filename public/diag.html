<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>WEEKLY FC 진단</title>
<style>
body{background:#000;color:#e5e5e5;font:13px/1.55 -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:14px}
h1{font-size:15px;margin:0 0 10px}
.r{border-bottom:1px solid #2a2a2a;padding:5px 0;word-break:break-all}
b{color:#8ab4f8;display:inline-block;min-width:112px}
.ok{color:#7ddb7d}.no{color:#ff7b7b}
</style></head><body>
<h1>WEEKLY FC 진단 — 이 화면을 캡처해 주세요</h1>
<div id="out"></div>
<script>
/* 일부러 옛 문법만 쓴다 — 최신 문법을 쓰면 이 진단 자체가 안 돌아 아무것도 못 본다. */
(function () {
  var out = document.getElementById('out');
  function add(k, v, ok) {
    var d = document.createElement('div'); d.className = 'r';
    var b = document.createElement('b'); b.appendChild(document.createTextNode(k));
    var s = document.createElement('span'); s.className = ok === true ? 'ok' : ok === false ? 'no' : '';
    s.appendChild(document.createTextNode(' ' + String(v)));
    d.appendChild(b); d.appendChild(s); out.appendChild(d);
  }
  window.__add = add;
  window.onerror = function (m, src, l) { add('onerror', m + ' @ ' + src + ':' + l, false); };
  window.addEventListener('unhandledrejection', function (e) {
    add('promise 실패', (e.reason && e.reason.message) || e.reason, false);
  });

  add('UA', navigator.userAgent);
  add('화면', window.innerWidth + '×' + window.innerHeight);
  add('customElements', typeof customElements, typeof customElements === 'object');
  add('Object.hasOwn', typeof Object.hasOwn, typeof Object.hasOwn === 'function');
  add('Array.at', typeof [].at, typeof [].at === 'function');
  try { new RegExp('(?<=a)b'); add('룩비하인드', '지원', true); } catch (e) { add('룩비하인드', e.message, false); }
  try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); add('localStorage', '됨', true); }
  catch (e) { add('localStorage', e.message, false); }

  /* module 스크립트가 아예 무시되는지 — 1.5초 안에 신호가 없으면 안 돈 것이다. */
  var t = setTimeout(function () { add('module 스크립트', '실행 안 됨', false); }, 1500);
  window.__mod = function () { clearTimeout(t); add('module 스크립트', '실행됨', true); };

  /* API 왕복 — 응답이 안 오는지(멈춤) 실패하는지(오류)를 가른다. 12초 제한. */
  var API = 'https://script.google.com/macros/s/AKfycbyUDTkTHsKszkiOeJKmNDHDkVJobrVUjbRqufU251PNKmlyrvC0BZ3ir9x0vM_lCJkkmg/exec?action=getAll';
  var done = false, t0 = Date.now();
  var to = setTimeout(function () { if (!done) { done = true; add('API 호출', '12초 동안 응답 없음 (멈춤)', false); } }, 12000);
  try {
    fetch(API).then(function (r) { return r.text(); }).then(function (txt) {
      if (done) return; done = true; clearTimeout(to);
      add('API 호출', (Date.now() - t0) + 'ms · ' + txt.length + '바이트 · ' + txt.slice(0, 40), true);
    })['catch'](function (e) {
      if (done) return; done = true; clearTimeout(to);
      add('API 호출', '실패 — ' + e.message, false);
    });
  } catch (e) { done = true; clearTimeout(to); add('API 호출', 'fetch 없음 — ' + e.message, false); }
})();
</script>
<script type="module">
window.__mod && window.__mod();
const add = window.__add;
(async () => {
  try {
    const html = await (await fetch('./')).text();
    const m = /component-url="([^"]*HomeApp[^"]*)"/.exec(html);
    if (!m) { add('앱 청크 찾기', '홈 아일랜드를 못 찾음', false); return; }
    add('앱 청크', m[1].split('/').pop(), true);
    await import(new URL(m[1], location.origin).href);
    add('앱 청크 import', '성공 — 스크립트는 정상', true);
  } catch (e) {
    add('앱 청크 import', '실패 — ' + (e && e.message), false);
  }
})();
</script>
</body></html>
