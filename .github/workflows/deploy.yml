name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # 영상 목록은 빌드 때 채널에서 긁어온다(scripts/fetch-videos.mjs) — 새 영상이
  # 올라오면 푸시 없이도 반영되도록 매일 05:00 KST 에 다시 빌드한다.
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
